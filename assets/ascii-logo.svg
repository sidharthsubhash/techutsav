<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" fill="none">
  <!-- ASCII Base letters in bold grey -->
  <g fill="#8e929b">
    <!-- 'a' -->
    <path d="M 120 180 C 70 180 30 150 30 100 C 30 50 70 20 120 20 C 160 20 185 45 190 70 L 145 78 C 140 60 125 48 105 48 C 75 48 55 70 55 100 C 55 130 75 152 105 152 C 125 152 140 140 145 122 L 190 130 C 185 155 160 180 120 180 Z" />
    <!-- 's' -->
    <path d="M 235 180 C 190 180 165 155 165 125 L 205 125 C 205 140 218 152 238 152 C 255 152 265 142 265 130 C 265 118 250 110 230 102 C 190 86 170 75 170 45 C 170 20 195 2 235 2 C 275 2 298 25 300 50 L 260 50 C 258 38 248 30 232 30 C 218 30 208 38 208 48 C 208 58 220 65 242 74 C 280 88 305 102 305 130 C 305 160 280 180 235 180 Z" />
    <!-- 'c' -->
    <path d="M 370 180 C 320 180 285 145 285 100 C 285 55 320 20 370 20 C 410 20 435 45 440 70 L 395 78 C 390 60 375 48 355 48 C 325 48 310 70 310 100 C 310 130 325 152 355 152 C 375 152 390 140 395 122 L 440 130 C 435 155 410 180 370 180 Z" />
    <!-- 'i' #1 -->
    <rect x="440" y="25" width="40" height="155" rx="6" />
    <circle cx="460" cy="55" r="14" fill="#ffffff" opacity="0.9" />
    <!-- 'i' #2 -->
    <rect x="500" y="25" width="40" height="155" rx="6" />
    <circle cx="520" cy="55" r="14" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Colorful ribbon / brush stroke overlays -->
  <path d="M 90 120 C 70 50 140 40 180 90 C 210 130 230 150 250 80 C 270 20 310 40 340 110 C 370 180 430 40 460 130" 
        stroke="url(#rainbowGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.92" filter="url(#glowRibbon)"/>
  
  <path d="M 120 100 C 140 40 190 60 210 120 C 230 170 260 180 280 120 C 310 30 360 60 390 130 C 410 170 430 160 450 100" 
        stroke="url(#warmGrad)" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.85"/>

  <text x="300" y="222" font-family="'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#e2e8f0" letter-spacing="9" text-anchor="middle">
    INNOVATING FOR THE FUTURE
  </text>

  <defs>
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="25%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="75%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glowRibbon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
</svg>
